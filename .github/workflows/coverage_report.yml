name: Coverage Report

on:
  push:
    branches: [dev, main]
    
permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
  
  steps:
    - uses: actions/checkout@v7
    
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    
    - run: dotnet restore backend/EventDrivenDddReference.sln
    - run: dotnet build backend/EventDrivenDddReference.sln --configuration Release --no-restore
      
    - name: Run tests with coverage
      run: |
        set -e
        
        mkdir -p coverage
        
        find backend -name '*.Tests.csproj' -print0 |
          while IFS= read -r -d '' test_project; do
            echo "Running tests for: $test_project"
        
            project_name=$(basename "$test_project" .Tests.csproj)
        
            dotnet test "$test_project" \
              --configuration Release \
              --no-build \
              /p:CollectCoverage=true \
              /p:CoverletOutput="$GITHUB_WORKSPACE/coverage/$project_name/" \
              /p:CoverletOutputFormat="json,cobertura"
          done
      
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
    - name: Generate combined coverage report
      run: |
        reportgenerator \
          "-reports:$GITHUB_WORKSPACE/coverage/**/*.cobertura.xml" \
          "-targetdir:$GITHUB_WORKSPACE/coverage/report" \
          "-reporttypes:JsonSummary;Html;Cobertura"
      
    - name: Read total coverage
      id: coverage
      run: |
        percent=$(jq -r '.summary.linecoverage' coverage/report/Summary.json)
        echo "Coverage: $percent%"
        echo "percent=$percent" >> "$GITHUB_OUTPUT"
      
    - name: Generate pie chart SVG
      env:
        BRANCH: ${{ github.ref_name }}
        PERCENT: ${{ steps.coverage.outputs.percent }}
      run: |
        mkdir -p docs
        
        cat <<EOF > docs/coverage-$BRANCH.svg
        <svg width="200" height="200" viewBox="0 0 32 32">
          <circle r="16" cx="16" cy="16" fill="#ddd"/>
          <circle r="16" cx="16" cy="16"
            fill="transparent"
            stroke="#4caf50"
            stroke-width="32"
            stroke-dasharray="$PERCENT 100"
            transform="rotate(-90 16 16)"/>
          <text x="16" y="16"
            font-size="8"
            text-anchor="middle"
            fill="#000">$PERCENT%</text>
        </svg>
        EOF
    
    - name: Commit updated coverage badge
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add docs/coverage-${{ github.ref_name }}.svg
        git commit -m "Update coverage badge [skip ci]" || echo "No changes"
        git push