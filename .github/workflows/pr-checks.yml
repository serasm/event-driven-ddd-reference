name: PR Checks

on:
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/EventDrivenDddReference.sln

      - name: Build
        run: dotnet build backend/EventDrivenDddReference.sln --configuration Release --no-restore

      - name: Run tests with coverage threshold
        run: |
          set -e
          
          find backend -name '*.Tests.csproj' -print0 |
            while IFS= read -r -d '' test_project; do
              echo "Running tests for: $test_project"
          
              dotnet test "$test_project" \
                --configuration Release \
                --no-build \
                /p:CollectCoverage=true \
                /p:CoverletOutputFormat=cobertura \
                /p:Threshold=80 \
                /p:ThresholdType=line \
                /p:ThresholdStat=total
            done